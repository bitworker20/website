<!doctype html>
<!--
  The token page. Its only job is to forward an authenticated entry from the
  gate to the overview. It exists because the gate's address must be
  unguessable while every cross-page link must be a fixed name that survives
  a passphrase rotation; this stub is the seam between the two.

  By the time the gate lands here, localStorage already holds the verifier,
  so guard.js on the destination passes. If you arrived at this URL some
  other way — bookmarked from an old deploy, guessed (you can't) — the
  guard bounces you to the door.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>BitPoker</title>
    <script>
      window.location.replace("overview.html");
    </script>
  </head>
  <body></body>
</html>
