<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BitPoker</title>
    <meta name="description" content="Coming soon.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b0e13">
    <meta property="og:type" content="website">
    <meta property="og:title" content="BitPoker">
    <meta property="og:description" content="Coming soon.">
    <meta property="og:image" content="assets/og-card-soon.png">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&amp;family=Barlow:wght@400&amp;display=swap"
      rel="stylesheet"
    >
    <style>
      :root { color-scheme: dark; }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(80% 60% at 50% 0%, rgba(227, 172, 62, .09), transparent 62%),
          #0b0e13;
        color: #ece7dc;
        font-family: "Barlow", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }

      .mark {
        width: 88px;
        height: 88px;
        display: block;
        margin: 0 auto 30px;
        cursor: default;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      h1 {
        margin: 0;
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
        font-weight: 600;
        font-size: clamp(34px, 7vw, 54px);
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      p {
        margin: 18px auto 0;
        max-width: 34ch;
        color: #6d7d90;
        font-size: 16px;
        line-height: 1.6;
      }

      .rule {
        width: 64px;
        height: 1px;
        margin: 30px auto 0;
        background: linear-gradient(90deg, transparent, #8a6a24, transparent);
      }

      input {
        margin-top: 26px;
        width: 232px;
        padding: 11px 14px;
        background: #131922;
        border: 1px solid #212a36;
        border-radius: 10px;
        color: #ece7dc;
        font: 400 16px/1 "Barlow", sans-serif;
        text-align: center;
      }
      input:focus { outline: 2px solid #8a6a24; outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
    <script src="gate.js" defer></script>
  </head>

  <body>
    <main>
      <img class="mark" src="assets/bitpoker-mark.svg" alt="BitPoker" width="88" height="88" data-knock>
      <h1>Coming soon</h1>
      <div class="rule"></div>
      <p>Heads-up poker without a dealer. Not open yet.</p>
      <input type="password" hidden data-knock-field aria-label="Passphrase" autocomplete="off" spellcheck="false">
    </main>
  </body>
</html>
